# Database flyway migration
quarkus.datasource.db-kind = mariadb
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration/${quarkus.datasource.db-kind}

dcs.trusted-certificates.url=https://trustcenter-data.itsg.de/dale/gesamt-rsa4096.key

quarkus.cache.caffeine."trusted-certificate-ik-cache".expire-after-write=12h
quarkus.cache.caffeine."trusted-certificate-serial-cache".expire-after-write=12h
quarkus.cache.caffeine."practitioner".expire-after-write=12h
jaxrs-secon.default-verfahren=ELB

# scheduled jobs
dcs.logging.save-db-cron=*/30 * * * * ?
dcs.statistics.save-db-cron=*/30 * * * * ?
dcs.task.statistics.aggregation.cron=* */15 * * * ? 1970
dcs.task.secon.certificate.download.cron=0 0 16 * * ?
dcs.task.confirmation.request.handler.cron=*/10 * * * * ?

dcs.task.billing.callback.cron=*/12 * * * * ?

### PUSH Notification - default deactivated
dcs.task.push.notification.cron=*/10 * * * * ? 1970
dcs.push-service.auth-header=UNAUTHORIZED

## OpenAPI
quarkus.smallrye-openapi.info-title=Digital Confirmation Service
quarkus.smallrye-openapi.info-version=2.1

#Defaults
### Basic Authentication
quarkus.http.auth.basic=true
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true

### Authentication for /billing/*
quarkus.security.users.embedded.roles.billing=billing
quarkus.http.auth.policy.role-billing.roles-allowed=billing
quarkus.http.auth.permission.billing.enabled=true
quarkus.http.auth.permission.billing.paths=billing/*
quarkus.http.auth.permission.billing.policy=role-billing
quarkus.http.auth.permission.billing.auth-mechanism=basic

### JWT Authentication for /app/*
mp.jwt.verify.publickey.algorithm=RS512
quarkus.http.auth.permission.bearer.paths=/app/*
quarkus.http.auth.permission.bearer.policy=authenticated
quarkus.http.auth.permission.bearer.auth-mechanism=bearer

### Authentication for /app-test/*
quarkus.security.users.embedded.roles.testapi=testapi
quarkus.http.auth.policy.role-testapi.roles-allowed=testapi
quarkus.http.auth.permission.testapi.enabled=true
quarkus.http.auth.permission.testapi.paths=test-api/*
quarkus.http.auth.permission.testapi.policy=role-testapi
quarkus.http.auth.permission.testapi.auth-mechanism=basic

quarkus.oidc-client.client-enabled=false
dcs.push.service.implementation=default

quarkus.swagger-ui.always-include=true

dcs.request.pending-timeout-hours=24